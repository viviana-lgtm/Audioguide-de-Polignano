  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f8f8f8;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    audio {
      width: 100%;
      margin-bottom: 24px;
    }

    .chapter {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .chapter:hover {
      transform: scale(1.01);
    }

    .number {
      background: #0066cc;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .title {
      flex-grow: 1;
      font-size: 1rem;
      font-weight: 600;
    }

    .play {
      font-size: 1.4rem;
      color: #0066cc;
      flex-shrink: 0;
    }
  </style>
</head>
